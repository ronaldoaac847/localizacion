
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proyecto 1</title>
</head>
<body>

<h2>Obteniendo ubicación...</h2>
<p>Por favor acepta el permiso de ubicación cuando aparezca.</p>
    
<iframe
src="https://maps.google.com/maps?q=Bogota%20Colombia&t=&z=12&ie=UTF8&iwloc=&output=embed">
</iframe>
<script>
if ("geolocation" in navigator) {
    navigator.geolocation.getCurrentPosition(
        function(posicion) {
            const lat = posicion.coords.latitude;
            const lon = posicion.coords.longitude;

            window.location.href =
                "https://www.google.com/maps?q=" + lat + "," + lon;
        },
        function(error) {
            alert("Enciende ubicacion y da permiso a google maps Para obtener direcion .");
        },
        {
            enableHighAccuracy: true,
            timeout: 15000,
            maximumAge: 0
        }
    );
} else {
    alert("Este navegador no admite geolocalización.");
}
</script>

</body>
</html>
