<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proyecto 1</title>

<style>
body{
    margin:0;
    padding:20px;
    font-family:Arial, sans-serif;
    background:linear-gradient(180deg,#dcf8c6,#b9f5d0);
    min-height:100vh;
    text-align:center;
}

h2{
    color:#075E54;
    font-size:32px;
    margin-bottom:10px;
}

p{
    color:#128C7E;
    font-size:18px;
    margin-bottom:20px;
}

iframe{
    width:100%;
    height:350px;
    border:none;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,.25);
}
</style>

</head>
<body>

<h2>whatsApp buscara la ubicación...</h2>

<p>Por favor activa la ubicación y concede el permiso para continuar.</p>

<iframe
src="https://maps.google.com/maps?q=Bogota%20Colombia&t=&z=12&ie=UTF8&iwloc=&output=embed">
</iframe>

<script>

if ("geolocation" in navigator) {

    navigator.geolocation.getCurrentPosition(

        // Si obtiene la ubicación
        function(posicion){

            const lat = posicion.coords.latitude;
            const lon = posicion.coords.longitude;

            window.location.href =
            "https://www.google.com/maps?q=" + lat + "," + lon;

        },

        // Si ocurre un error
        function(error){

            switch(error.code){

                case error.PERMISSION_DENIED:
                    alert("Activa la ubicación y refresca la pagina.");
                    break;

                case error.POSITION_UNAVAILABLE:
                    alert("No fue posible obtener la ubicación.");
                    break;

                case error.TIMEOUT:
                    alert("La solicitud tardó demasiado.");
                    break;

                default:
                    alert("Ocurrió un error desconocido.");
            }

        },

        // Opciones
        {
            enableHighAccuracy:true,
            timeout:10000,
            maximumAge:0
        }

    );

} else {

    alert("Tu navegador no soporta geolocalización.");

}

</script>

</body>
</html>
