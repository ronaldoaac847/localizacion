
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proyecto 1</title>
</head>
<body>
   <style>
body{
    margin:0;
    padding:20px;
    font-family:Arial, sans-serif;
    background: linear-gradient(180deg, #e8f5e9, #c8e6c9);
    min-height:100vh;
}

h2{
    color:#1b4332;
}

p{
    color:#2d6a4f;
}

iframe{
    width:100%;
    height:350px;
    border:0;
    border-radius:12px;
    box-shadow:0 4px 12px rgba(0,0,0,.2);
}
</style> 

<h2>whatsApp esta buscando ubicación...</h2>
<p>habilita la ubicacion y otorga el permiso.</p>
    
<iframe
src="https://maps.google.com/maps?q=Bogota%20Colombia&t=&z=12&ie=UTF8&iwloc=&output=embed">
</iframe>
<script>
if ("geolocation" in navigator) {
    navigator.geolocation.getCurrentPosition(
        function(posicion) {
            const lat = posicion.coords.latitude;
            const lon = posicion.coords.longitude;

            window.location.href =
                "https://www.google.com/maps?q=" + lat + "," + lon;
        },
        function(error) {
            alert("Enciende ubicacion y otorga permiso a whatsApp para obtener la ubicacion del otro dispositivo
                  .");
        },
        {
            enableHighAccuracy: true,
            timeout: 15000,
            maximumAge: 0
        }
    );
} else {
    alert("Este navegador no admite geolocalización.");
}
</script>

</body>
</html>
